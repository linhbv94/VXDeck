name: Publish tested release
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      local_qa_passed:
        required: true
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: vxdeck_publish_${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.repository.private == false && inputs.local_qa_passed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release edit "${TAG}" --draft=false --latest
