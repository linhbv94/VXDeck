name: Desktop release (free public runners)
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: vxdeck_release_${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Run Test Suites
        run: |
          swift run VXDeckCoreTests
          python3 scripts/check_settings_ui.py
          python3 scripts/test_update_helper.py
          python3 scripts/test_update_termination.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install manifest signing dependency
        run: python3 -m pip install 'cryptography==46.0.3'
      - name: Package Release Bundle & DMG
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          VXDECK_SIGNING_PRIVATE_KEY: ${{ secrets.VXDECK_SIGNING_PRIVATE_KEY }}
        run: |
          RAW_VER="${TAG#v}"
          ./scripts/package_release.sh "${RAW_VER}"
      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          RAW_VER="${TAG#v}"
          NOTES_FILE="docs/release_notes/${RAW_VER}.md"
          if [ ! -f "${NOTES_FILE}" ]; then
            NOTES_FILE="docs/release_notes/1.0.5.md"
          fi
          gh release create "${TAG}" \
            --draft \
            --title "VXDeck ${TAG}" \
            --notes-file "${NOTES_FILE}" \
            build/vxdeck_${RAW_VER}_macos_silicon.dmg \
            build/latest.json
